const metaJ=()=>JSON.stringify({events:S.events,lots:S.lots,exps:S.exps||[],trades:S.trades||[],snaps:S.snaps||[],brand:S.brand||{},fees:S.fees,sec:S.sec||null});
async function push(){if(!DBc)return;if(pushing){dirty=true;return}pushing=true;const was=SY;
 try{do{dirty=false;const now=Date.now();
  for(const i of S.items){const s=strip(i);if(known[i.id]!==s){i.u=now;await DBc.doc('i_'+i.id).set({j:JSON.stringify(i),u:now});known[i.id]=s}}
  for(const id of (S.gone||[]).slice()){await DBc.doc('i_'+id).set({dead:1,u:now});S.gone=S.gone.filter(x=>x!=id)}
  const mj=metaJ();if(mj!==kmeta){S.mu=now;await DBc.doc('meta').set({j:mj,u:now});kmeta=mj}
  saveLocal()}while(dirty);SY='on'}catch(e){SY='err';if(typeof SBF!='undefined')SBF.err=String(e&&e.message||e)}
 pushing=false;if(SY!==was&&tab=='set')render()}
function pull(snap){let ch=false;
 snap.docs.forEach(d=>{const v=d.data();if(!v)return;
  if(d.id=='meta'){if(v.j===kmeta&&v.u===S.mu)return;let m;try{m=JSON.parse(v.j)}catch(e){return}
   m.events.forEach(e=>{const x=S.events.find(y=>y.id==e.id);if(!x){S.events.push(e);ch=true}else if((e.date||'')!==(x.date||'')&&(v.u||0)>(S.mu||0)){x.date=e.date;ch=true}else if((e.mod||0)>(x.mod||0)){x.note=e.note;x.closed=e.closed;x.mod=e.mod;ch=true}});
   m.lots.forEach(l=>{if(!S.lots.some(x=>x.id==l.id)){S.lots.push(l);ch=true}});
   S.snaps=S.snaps||[];(m.snaps||[]).forEach(s=>{if(!S.snaps.some(y=>y.d==s.d)){S.snaps.push(s);S.snaps.sort((a,b)=>a.d.localeCompare(b.d));ch=true}});
   S.trades=S.trades||[];(m.trades||[]).forEach(l=>{if(!S.trades.some(y=>y.id==l.id)){S.trades.push(l);ch=true}});
   S.exps=S.exps||[];(m.exps||[]).forEach(l=>{const x=S.exps.find(y=>y.id==l.id);if(!x){S.exps.push(l);ch=true}else if(l.del&&!x.del){x.del=1;ch=true}else if((l.mod||0)>(x.mod||0)){Object.assign(x,l);ch=true}else if(l.paid&&!x.paid){x.paid=1;ch=true}});
   if((v.u||0)>(S.mu||0)&&m.brand&&JSON.stringify(m.brand)!==JSON.stringify(S.brand||{})){S.brand=m.brand;ch=true}

   kmeta=v.j;return}
  if(!d.id.startsWith('i_'))return;const id=d.id.slice(2),loc=S.items.find(x=>x.id==id);
  if(v.dead){if(loc){S.items=S.items.filter(x=>x!=loc);ch=true}delete known[id];return}

   S.items=loc?S.items.map(x=>x==loc?it:x):[...S.items,it];known[id]=strip(it);ch=true}});

/*I18N*/const I18N=[["Les repas sont déductibles à 50 % seulement ; les autres catégories à 100 % si elles servent à ton entreprise (pour l’essence, seulement la part affaires). Les montants incluent les taxes payées. Les abonnements comptent seulement une fois payés. Estimation de suivi : valide avec ton comptable.", "Meals are only 50% deductible; other categories are 100% if they are for your business (for gas, only the business share). Amounts include the taxes paid. Subscriptions only count once paid. Tracking estimate: check with your accountant."], ["Le transfert de données (5 Go/mois gratuits) et le stockage de fichiers (1 Go) se voient seulement dans le tableau de bord Supabase, onglet <b>Usage</b>. Un projet gratuit se met en pause après 7 jours sans aucune activité.", "Data transfer (5 GB/month free) and file storage (1 GB) are only shown in the Supabase dashboard, <b>Usage</b> tab. A free project pauses after 7 days with no activity."], ["cartes Pokémon (toutes les raretés) intégrée à l’app, de 1999 à aujourd’hui (noms anglais ; tu peux chercher avec le nom français). Les cartes françaises ont le même numéro que l’anglaise.", "rare-and-up Pokémon cards built into the app, from 1999 to today (English names; you can search with the French name). French cards have the same number as the English one."], ["Vois l’app exactement comme un membre la voit : sections permises, cadenas, écran d’abonnement expiré. Tu restes connecté avec tes propres données ; rien n’est modifié.", "See the app exactly as a member sees it: allowed sections, locks, expired-subscription screen. You stay signed in with your own data; nothing is changed."], ["Gratuit : site jusqu’à 1 Go et environ 100 Go de transfert par mois. L’app pèse environ 6 Mo ; les prix et empreintes de cartes se mettent à jour seuls chaque jour.", "Free: site up to 1 GB and about 100 GB of transfer per month. The app weighs about 6 MB; card prices and fingerprints update themselves daily."], ["Les tables existent, mais Supabase ne leur a pas encore donné les permissions. Le code SQL a été mis à jour pour les ajouter : relance-le une fois.", "The tables exist, but Supabase hasn’t given them permissions yet. The SQL code was updated to add them: run it once more."], ["cartes Pokémon intégrée à l’app (noms anglais ; tu peux chercher avec le nom français). Les cartes françaises ont le même numéro que l’anglaise.", "Pokémon cards built into the app (English names; you can search with the French name). French cards have the same number as the English one."], ["Ajoute l’app à ton écran d’accueil : elle s’ouvre en plein écran avec son icône, comme une vraie application. Tes données restent les mêmes.", "Add the app to your home screen: it opens full screen with its icon, like a real app. Your data stays the same."], ["Le transfert de données (5 Go/mois gratuits) et le stockage de fichiers (1 Go) se voient seulement dans le tableau de bord Supabase, onglet ", "Data transfer (5 GB/month free) and file storage (1 GB) are only shown in the Supabase dashboard, tab "], ["Connecte-toi pour avoir les mêmes données sur ton iPhone et ton PC. Utilise le même courriel et le même mot de passe sur chaque appareil.", "Sign in to have the same data on your iPhone and PC. Use the same email and password on each device."], ["Un seul prix pour toutes les cartes choisies : il est réparti entre les cartes selon leur valeur marchande (ou leur coût à défaut).", "One price for all selected cards: it is split across the cards by market value (or cost if there is none)."], ["Tes données restent en sécurité dans ton compte et seront retirées de cet appareil. Tu pourras te connecter avec un autre courriel.", "Your data stays safe in your account and will be removed from this device. You can then sign in with another email."], ["Voici ce que l’app a lu. Touche la bonne carte dans la liste, corrige la recherche, ou ferme pour modifier les champs à la main.", "Here’s what the app read. Tap the right card in the
