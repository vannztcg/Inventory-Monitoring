<script>
const $=s=>document.querySelector(s);
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const def=()=>({events:[],ev:'',lots:[],items:[],exps:[],trades:[],fees:{Cash:[0,0],Virement:[0,0],Carte:[2.5,0.1],PayPal:[2.99,0.49],eBay:[13.25,0.3]}});
let S;try{S=JSON.parse(localStorage.getItem('cv1'))||def()}catch(e){S=def()}
const saveLocal=()=>{try{localStorage.setItem('cv1',JSON.stringify(S))}catch(e){}};
let DBc=null,SY='off',known={},kmeta='',pushing=false,dirty=false,pt=null;
const save=()=>{saveLocal();if(DBc){clearTimeout(pt);pt=setTimeout(push,400)}};
const strip=i=>{const{u,...r}=i;return JSON.stringify(r)};
const metaJ=()=>JSON.stringify({events:S.events,lots:S.lots,exps:S.exps||[],trades:S.trades||[],snaps:S.snaps||[],brand:S.brand||{},fees:S.fees,sec:S.sec||null});
async function push(){if(!DBc)return;if(pushing){dirty=true;return}pushing=true;const was=SY;
 try{do{dirty=false;const now=Date.now();
  for(const i of S.items){const s=strip(i);if(known[i.id]!==s){i.u=now;await DBc.doc('i_'+i.id).set({j:JSON.stringify(i),u:now});known[i.id]=s}}
  for(const id of (S.gone||[]).slice()){await DBc.doc('i_'+id).set({dead:1,u:now});S.gone=S.gone.filter(x=>x!=id)}
  const mj=metaJ();if(mj!==kmeta){S.mu=now;await DBc.doc('meta').set({j:mj,u:now});kmeta=mj}
  saveLocal()}while(dirty);SY='on'}catch(e){SY='err';if(typeof SBF!='undefined')SBF.err=String(e&&e.message||e)}
 pushing=false;if(SY!==was&&tab=='set')render()}
function pull(snap){let ch=false;
 snap.docs.forEach(d=>{const v=d.data();if(!v)return;
  if(d.id=='meta'){if(v.j===kmeta&&v.u===S.mu)return;let m;try{m=JSON.parse(v.j)}catch(e){return}
   m.events.forEach(e=>{const x=S.events.find(y=>y.id==e.id);if(!x){S.events.push(e);ch=true}else if((e.date||'')!==(x.date||'')&&(v.u||0)>(S.mu||0)){x.date=e.date;ch=true}else if((e.mod||0)>(x.mod||0)){x.note=e.note;x.closed=e.closed;x.mod=e.mod;ch=true}});
   m.lots.forEach(l=>{if(!S.lots.some(x=>x.id==l.id)){S.lots.push(l);ch=true}});
   S.snaps=S.snaps||[];(m.snaps||[]).forEach(s=>{if(!S.snaps.some(y=>y.d==s.d)){S.snaps.push(s);S.snaps.sort((a,b)=>a.d.localeCompare(b.d));ch=true}});
   S.trades=S.trades||[];(m.trades||[]).forEach(l=>{if(!S.trades.some(y=>y.id==l.id)){S.trades.push(l);ch=true}});
   S.exps=S.exps||[];(m.exps||[]).forEach(l=>{const x=S.exps.find(y=>y.id==l.id);if(!x){S.exps.push(l);ch=true}else if(l.del&&!x.del){x.del=1;ch=true}else if((l.mod||0)>(x.mod||0)){Object.assign(x,l);ch=true}else if(l.paid&&!x.paid){x.paid=1;ch=true}});
   if((v.u||0)>(S.mu||0)&&m.brand&&JSON.stringify(m.brand)!==JSON.stringify(S.brand||{})){S.brand=m.brand;ch=true}
   if((v.u||0)>(S.mu||0)&&'sec' in m&&JSON.stringify(m.sec||null)!==JSON.stringify(S.sec||null)){S.sec=m.sec||null;ch=true}
   if((v.u||0)>(S.mu||0)){if(JSON.stringify(S.fees)!==JSON.stringify(m.fees)){S.fees=m.fees;ch=true}S.mu=v.u}
   kmeta=v.j;return}
  if(!d.id.startsWith('i_'))return;const id=d.id.slice(2),loc=S.items.find(x=>x.id==id);
  if(v.dead){if(loc){S.items=S.items.filter(x=>x!=loc);ch=true}delete known[id];return}
  if(!loc||(v.u||0)>(loc.u||0)){let it;try{it=JSON.parse(v.j)}catch(e){return}it.u=v.u;
   S.items=loc?S.items.map(x=>x==loc?it:x):[...S.items,it];known[id]=strip(it);ch=true}});
 if(ch){S.items.sort((a,b)=>b.date.localeCompare(a.date));saveLocal();if(!/INPUT|SELECT/.test((document.activeElement||{}).tagName||''))render()}
 push()}

function applyImport(d){let a=0,b=0;
 if(d.purge){const keep=new Set((d.items||[]).map(x=>x.id)),rm=S.items.filter(x=>x.src&&!keep.has(x.id));rm.forEach(x=>(S.gone=S.gone||[]).push(x.id));S.items=S.items.filter(x=>!rm.includes(x))}
 (d.events||[]).forEach(x=>{if(!S.events.some(y=>y.id==x.id))S.events.push(x)});
 S.exps=S.exps||[];(d.exps||[]).forEach(x=>{if(!S.exps.some(y=>y.id==x.id))S.exps.push(x)});
 (d.items||[]).forEach(x=>{if(S.items.some(y=>y.id==x.id)||(S.gone||[]).includes(x.id))b++;else{S.items.push(x);a++}});
 S.items.sort((p,q)=>q.date.localeCompare(p.date));save();return[a,b]}
async function seed(){if(STANDALONE)return;try{const f=localStorage.getItem('cv_seed');if(f=='excel2')return;await new Promise(r=>setTimeout(r,3000));if(!f&&S.items.length)return;const r=await fetch('cardvendor-import.json');if(!r.ok)return;const d=await r.json(),[a]=applyImport(d);localStorage.setItem('cv_seed',d.seed||'1');flash('Données Excel importées ('+a+' cartes) ✓');bulkImg()}catch(e){}}
if(STANDALONE)sbHash();applyUI();render();initSync();seed();preCheck();if(STANDALONE){sbStart();setTimeout(()=>cdb().catch(()=>{}),4000)}
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
