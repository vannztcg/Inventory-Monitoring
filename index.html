<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14161a;--mut:#6b7280;--ac:#2563eb;--act:#fff;--ok:#15803d;--ko:#b91c1c;--bd:#e3e5ea;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}

#main{max-width:560px;margin:0 auto;padding:14px}
h2{margin:6px 0 12px;font-size:24px;font-weight:800;letter-spacing:-.01em}h2::after{content:'';display:block;width:34px;height:4px;border-radius:4px;margin-top:6px;background:var(--ac)}h3{margin:18px 0 8px;font-size:15px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r,14px);padding:12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.05)}

nav{overflow-x:auto}nav button{flex:1 0 auto;min-width:66px;padding:12px 6px;border:0;background:none;color:var(--mut);font-size:10px}nav button.on{color:var(--ac);font-weight:700;box-shadow:inset 0 3px 0 var(--ac)}

.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--bd);padding:0;flex:none}.sw.on{box-shadow:0 0 0 3px var(--tx)}body[data-bg=glow]{background-image:radial-gradient(900px 320px at 50% -90px,color-mix(in srgb,var(--ac) 22%,transparent),transparent);background-repeat:no-repeat}

.it.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset}.ck{font-size:22px;flex:none}.tg tr.on{background:var(--bg)}.btn[disabled]{opacity:.5}
.tw{overflow-x:auto}.tg{width:100%;border-collapse:collapse;font-size:14px;background:var(--card);border:1px solid var(--bd);border-radius:12px}.tg th{text-align:left;color:var(--mut);font-weight:600;padding:10px;border-bottom:1px solid var(--bd)}.tg td{padding:10px;border-bottom:1px solid var(--bd)}.tg tr[data-open],.tg tr[data-sel]{cursor:pointer}.tg tr[data-open]:hover{background:var(--bg)}

.home{position:relative;overflow:hidden;border-radius:24px;min-height:calc(100vh - 150px);color:#eef4ff;background:radial-gradient(120% 80% at 50% 0%,#0d1b36 0%,#060a14 55%,#02040a 100%);isolation:isolate;--r0:0}
.home .orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;z-index:-1;animation:horb 14s ease-in-out infinite alternate}
.home .o1{width:300px;height:300px;background:#1f6fe0;left:-80px;top:-60px}.home .o2{width:260px;height:260px;background:#0aa5ff;right:-70px;bottom:40px;animation-duration:18s;animation-delay:-6s;opacity:.35}
.home .hc{position:absolute;width:64px;aspect-ratio:5/7;border:2px solid rgba(120,180,255,.22);border-radius:8px;z-index:-1;animation:hfloat 9s ease-in-out infinite;background:linear-gradient(160deg,rgba(80,150,255,.08),transparent)}
.home .hc::after{content:'';position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;border-radius:50%;border:2px solid rgba(120,180,255,.3)}
.home .dot{position:absolute;bottom:-10px;width:4px;height:4px;border-radius:50%;background:#6ab4ff;opacity:0;z-index:-1;animation:hrise 9s linear infinite}
.home .splash{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 150px);width:100%;border:0;background:none;color:inherit;cursor:pointer;padding:24px 16px}
.home .hbg{position:absolute;left:50%;top:50%;width:min(100%,560px);max-width:none;transform:translate(-50%,-50%);opacity:.24;z-index:-1;pointer-events:none;animation:hbreath 9s ease-in-out infinite}.home .hbg.cover{width:100%;height:100%;object-fit:cover;opacity:.4;left:0;top:0;transform:none;animation:none}.home .hbg.cover+.shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(2,4,10,.55),rgba(2,4,10,.8))}
.home .ttl{display:flex;flex-direction:column;align-items:center;line-height:1;font-weight:800;text-shadow:0 0 24px rgba(74,163,255,.55)}.home .ttl b{display:flex;font-size:clamp(34px,10vw,58px);letter-spacing:.12em;background:linear-gradient(180deg,#fff,#7fb6ff);-webkit-background-clip:text;background-clip:text;color:transparent}.home .ttl b:last-child{margin-top:6px;font-size:clamp(20px,6vw,34px);letter-spacing:.3em;margin-right:-.3em;background:linear-gradient(90deg,#4aa3ff,#9fd0ff);-webkit-background-clip:text;background-clip:text}.home .ttl b span{display:inline-block;animation:hletter .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d)*55ms + .2s)}.home .ttl.sm b{font-size:clamp(24px,7vw,36px)}.home .ttl.sm b:last-child{font-size:clamp(14px,4vw,20px)}
@keyframes hbreath{0%,100%{opacity:.18;transform:translate(-50%,-50%) scale(1)}50%{opacity:.3;transform:translate(-50%,-50%) scale(1.05)}}@keyframes hletter{from{opacity:0;transform:translateY(-22px) scale(1.4);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
.home .lg{display:block;width:min(88%,460px);height:auto;animation:hlogo 1.4s cubic-bezier(.2,.8,.2,1) both,hglow 4s ease-in-out 1.4s infinite}
.home .lg.sm{width:min(60%,250px)}
.home .tap{margin-top:22px;font-size:13px;letter-spacing:.28em;text-transform:uppercase;color:#8fc2ff;animation:hpulse 2.2s ease-in-out infinite}
.home .ecg{width:min(78%,360px);height:34px;margin-top:6px;overflow:visible}
.home .ecg path{fill:none;stroke:#4aa3ff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:140 460;filter:drop-shadow(0 0 6px #4aa3ff);animation:hecg 2.8s linear infinite}
.home .ecg .base{stroke:rgba(74,163,255,.18);stroke-dasharray:none;animation:none;filter:none}
.home .top{display:flex;flex-direction:column;align-items:center;padding:22px 14px 6px}
.home .sub{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#7fb6ff;margin-top:2px}
.home .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}
.home .st{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:12px;backdrop-filter:blur(8px)}
.home .st span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#8fb4e6}
.home .st b{display:block;font-size:22px;margin-top:2px;color:#fff}.home .st b.ok{color:#4ade80}.home .st b.ko{color:#f87171}
.home .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:0 14px}
.home .hchip{font-size:12px;padding:6px 12px;border-radius:999px;background:rgba(74,163,255,.14);border:1px solid rgba(74,163,255,.35);color:#bcdcff}
.home .qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 14px 0}.home .qa button{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 6px;border-radius:14px;border:1px solid rgba(74,163,255,.45);background:linear-gradient(135deg,rgba(47,123,255,.35),rgba(10,165,255,.18));color:#fff;font-size:13px;font-weight:700;box-shadow:0 6px 18px rgba(30,110,230,.3);transition:transform .15s}.home .qa button:active{transform:scale(.95)}.home .qa b{font-size:17px}
@media (min-width:900px){.home .qa{max-width:620px;margin:0 auto;width:100%}}
.home .tile.wide{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center;padding:14px 16px;text-align:left}.home .tile.wide svg{width:46%;height:46px;overflow:visible}.home .tile.wide small{display:block;font-weight:500;color:#9cc6ff;font-size:12px;margin-top:2px}
.home .rem{display:flex;flex-direction:column;gap:8px;padding:12px 14px 0}.home .rem button{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border-radius:14px;border:1px solid rgba(245,158,11,.45);background:rgba(245,158,11,.12);color:#fde7b0;font-size:13px}.home .rem button.info{border-color:rgba(74,163,255,.35);background:rgba(74,163,255,.1);color:#cfe4ff}.home .rem b{font-size:16px}
.gx svg{width:100%;height:auto;display:block}.gx .lgd{display:flex;gap:14px;font-size:13px;color:var(--mut);margin-top:6px}.gx .lgd i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.home .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 14px 22px}
.home .tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 6px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);color:#eef4ff;font-size:13px;font-weight:600;backdrop-filter:blur(8px);transition:transform .18s,background .18s,box-shadow .18s}
.home .tile:hover{transform:translateY(-4px);background:rgba(74,163,255,.16);box-shadow:0 10px 26px rgba(30,110,230,.35)}.home .tile:active{transform:scale(.95)}
.home .tile i{font-style:normal;display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:14px;font-size:22px;color:#fff;background:linear-gradient(135deg,var(--c1,#2f7bff),var(--c2,#0aa5ff));box-shadow:0 6px 16px rgba(30,110,230,.4)}
.home .tile em{position:absolute;top:8px;right:8px;min-width:20px;height:20px;border-radius:10px;padding:0 6px;background:#f59e0b;color:#111;font:700 12px/20px system-ui;text-align:center;font-style:normal;animation:hpulse 1.6s ease-in-out infinite}
.home .in{animation:hfade .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
.home.still .in,.home.still .ttl b span{animation-duration:0s;animation-delay:0s}
@keyframes hfade{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:none}}
@keyframes hlogo{from{opacity:0;transform:scale(.8) translateY(14px);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes hglow{0%,100%{filter:drop-shadow(0 0 10px rgba(74,163,255,.25))}50%{filter:drop-shadow(0 0 30px rgba(74,163,255,.7))}}
@keyframes hpulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes hecg{to{stroke-dashoffset:-600}}
@keyframes horb{from{transform:translate(0,0) scale(1)}to{transform:translate(40px,30px) scale(1.25)}}
@keyframes hfloat{0%,100%{transform:translateY(0) rotate(var(--rt,-12deg))}50%{transform:translateY(-26px) rotate(calc(var(--rt,-12deg) + 8deg))}}
@keyframes hrise{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-420px);opacity:0}}
@media (prefers-reduced-motion:reduce){.home *,.home{animation:none !important}.home .in{opacity:1}}
@media (min-width:900px){.home .tiles{grid-template-columns:repeat(3,1fr);max-width:620px;margin:0 auto;width:100%}.home .stats{grid-template-columns:repeat(3,1fr);max-width:760px;margin:0 auto;width:100%}}
@media (min-width:900px){
body{padding-bottom:0;padding-left:210px}

nav button{flex:none;text-align:left;font-size:16px;padding:12px 14px;border-radius:10px}nav button.on{background:var(--bg)}nav span{display:inline-block;width:26px}
.cols{display:grid;grid-template-columns:minmax(380px,520px) 1fr;gap:24px;align-items:start}.cols aside{display:block}
.grid{grid-template-columns:repeat(4,1fr)}

}

nav{display:none!important}body{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))!important;padding-left:0!important}
.tb{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:12px;margin:-14px -14px 12px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}

async function push(){if(!DBc)return;if(pushing){dirty=true;return}pushing=true;const was=SY;
 try{do{dirty=false;const now=Date.now();
  for(const i of S.items){const s=strip(i);if(known[i.id]!==s){i.u=now;await DBc.doc('i_'+i.id).set({j:JSON.stringify(i),u:now});known[i.id]=s}}
  for(const id of (S.gone||[]).slice()){await DBc.doc('i_'+id).set({dead:1,u:now});S.gone=S.gone.filter(x=>x!=id)}
  const mj=metaJ();if(mj!==kmeta){S.mu=now;await DBc.doc('meta').set({j:mj,u:now});kmeta=mj}
  saveLocal()}while(dirty);SY='on'}catch(e){SY='err';if(typeof SBF!='undefined')SBF.err=String(e&&e.message||e)}
 pushing=false;if(SY!==was&&tab=='set')render()}
function pull(snap){let ch=false;
 snap.docs.forEach(d=>{const v=d.data();if(!v)return;
  if(d.id=='meta'){if(v.j===kmeta&&v.u===S.mu)return;let m;try{m=JSON.parse(v.j)}catch(e){return}
   m.events.forEach(e=>{const x=S.events.find(y=>y.id==e.id);if(!x){S.events.push(e);ch=true}else if((e.date||'')!==(x.date||'')&&(v.u||0)>(S.mu||0)){x.date=e.date;ch=true}else if((e.mod||0)>(x.mod||0)){x.note=e.note;x.closed=e.closed;x.mod=e.mod;ch=true}});
   m.lots.forEach(l=>{if(!S.lots.some(x=>x.id==l.id)){S.lots.push(l);ch=true}});
   S.snaps=S.snaps||[];(m.snaps||[]).forEach(s=>{if(!S.snaps.some(y=>y.d==s.d)){S.snaps.push(s);S.snaps.sort((a,b)=>a.d.localeCompare(b.d));ch=true}});
   S.trades=S.trades||[];(m.trades||[]).forEach(l=>{if(!S.trades.some(y=>y.id==l.id)){S.trades.push(l);ch=true}});
   S.exps=S.exps||[];(m.exps||[]).forEach(l=>{const x=S.exps.find(y=>y.id==l.id);if(!x){S.exps.push(l);ch=true}else if(l.del&&!x.del){x.del=1;ch=true}else if((l.mod||0)>(x.mod||0)){Object.assign(x,l);ch=true}else if(l.paid&&!x.paid){x.paid=1;ch=true}});
   if((v.u||0)>(S.mu||0)&&m.brand&&JSON.stringify(m.brand)!==JSON.stringify(S.brand||{})){S.brand=m.brand;ch=true}
   if((v.u||0)>(S.mu||0)){if(JSON.stringify(S.fees)!==JSON.stringify(m.fees)){S.fees=m.fees;ch=true}S.mu=v.u}
   kmeta=v.j;return}
  if(!d.id.startsWith('i_'))return;const id=d.id.slice(2),loc=S.items.find(x=>x.id==id);
  if(v.dead){if(loc){S.items=S.items.filter(x=>x!=loc);ch=true}delete known[id];return}
  if(!loc||(v.u||0)>(loc.u||0)){let it;try{it=JSON.parse(v.j)}catch(e){return}it.u=v.u;
   S.items=loc?S.items.map(x=>x==loc?it:x):[...S.items,it];known[id]=strip(it);ch=true}});
 if(ch){S.items.sort((a,b)=>b.date.localeCompare(a.date));saveLocal();if(!/INPUT|SELECT/.test((document.activeElement||{}).tagName||''))render()}
 push()}

 DBc.onSnapshot(s=>{clearTimeout(tm);const was=SY;SY='on';pull(s);if(was!=='on'&&tab=='set')render()},()=>{SY='err';if(tab=='set')render()})}catch(e){SY='err'}}

document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target&&e.target.dataset&&e.target.dataset.i=='PK.q'){e.preventDefault();srGo();return}if(e.key=='Escape'&&(sheet||EE.id)){sheet=null;EE={id:''};render()}else if(e.key=='Escape'&&tab!='home'&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){goHome()}else if(e.key=='Enter'&&tab=='buy'&&!sheet&&e.target.tagName=='INPUT'&&e.target.type!='file')$('[data-a=add]').click()});
function applyImport(d){let a=0,b=0;
 if(d.purge){const keep=new Set((d.items||[]).map(x=>x.id)),rm=S.items.filter(x=>x.src&&!keep.has(x.id));rm.forEach(x=>(S.gone=S.gone||[]).push(x.id));S.items=S.items.filter(x=>!rm.includes(x))}
 (d.events||[]).forEach(x=>{if(!S.events.some(y=>y.id==x.id))S.events.push(x)});
 S.exps=S.exps||[];(d.exps||[]).forEach(x=>{if(!S.exps.some(y=>y.id==x.id))S.exps.push(x)});
 (d.items||[]).forEach(x=>{if(S.items.some(y=>y.id==x.id)||(S.gone||[]).includes(x.id))b++;else{S.items.push(x);a++}});
 S.items.sort((p,q)=>q.date.localeCompare(p.date));save();return[a,b]}
async function seed(){if(STANDALONE)return;try{const f=localStorage.getItem('cv_seed');if(f=='excel2')return;await new Promise(r=>setTimeout(r,3000));if(!f&&S.items.length)return;const r=await fetch('cardvendor-import.json');if(!r.ok)return;const d=await r.json(),[a]=applyImport(d);localStorage.setItem('cv_seed',d.seed||'1');flash('Données Excel importées ('+a+' cartes) ✓');bulkImg()}catch(e){}}
if(STANDALONE)sbHash();applyUI();render();initSync();seed();preCheck();if(STANDALONE){sbStart();setTimeout(()=>cdb().catch(()=>{}),4000)}
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
