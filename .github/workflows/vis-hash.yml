name: Empreintes visuelles des cartes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/vis_hash.py', '.github/workflows/vis-hash.yml', 'cards-db.json']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy
      - run: python tools/vis_hash.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards-vis.bin tools/vis_report.txt
          git commit -m "Empreintes visuelles des cartes [skip ci]" || echo "rien a changer"
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
