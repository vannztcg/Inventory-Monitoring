name: Historique des prix (remplissage du passé)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/hist.py', '.github/workflows/hist.yml']
permissions:
  contents: write
concurrency: prices
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: '[ -f tools/pmap.json ] || python tools/prices.py'
      - run: python tools/hist.py --backfill
        env:
          BUDGET: '8400'
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hist prices-chg.json prices.json tools/pmap.json tools/hist_done.json tools/price_report.txt
          git commit -m "Historique des prix $(date +%F) [skip ci]" || echo "rien a changer"
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
