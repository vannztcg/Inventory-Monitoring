name: Cartes japonaises (catalogue, photos et empreintes)
on:
  workflow_dispatch:
  schedule:
    - cron: '41 7 * * 1'
  push:
    branches: [main]
    paths: ['tools/jp_build.py', 'tools/jp_tcgdex.json', '.github/workflows/jp.yml']
permissions:
  contents: write
concurrency: jp
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy
      - run: python tools/jp_build.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards-jp.json cards-jp-vis.bin tools/jp_report.txt
          git commit -m "Cartes japonaises : catalogue, photos et empreintes [skip ci]" || echo "rien a changer"
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
